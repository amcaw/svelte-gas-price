name: Update SPF prices

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {}

concurrency:
  group: update-spf
  cancel-in-progress: false

jobs:
  update-spf:
    name: Fetch SPF prices
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch SPF prices
        run: node scripts/fetch-prices.js

      - name: Check if data changed
        id: diff
        run: |
          git diff --quiet public/data/prices.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/prices.json
          git commit -m "chore: update SPF prices $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

      - name: Update data/prices.json on gh-pages directly
        if: steps.diff.outputs.changed == 'true'
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages gh-pages
          cp public/data/prices.json /tmp/gh-pages/data/prices.json
          cd /tmp/gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "chore: update prices data $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push origin gh-pages && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
